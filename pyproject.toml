[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pruning-transformer"
version = "0.2.0"
description = "Structured FFN and attention-head pruning criteria for transformer models (BERT/RoBERTa)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
# The package itself needs only torch/numpy/pandas. Everything below is
# for running `experiments/`, which is what pulls in HuggingFace.
experiments = [
    "transformers>=4.46",   # `eval_strategy`; earlier releases name it `evaluation_strategy`
    "datasets>=2.19",
    "evaluate>=0.4",
    "accelerate>=0.30",
    "scikit-learn>=1.3",
    "torchvision>=0.15",    # stages 01-02 only
    "matplotlib>=3.7",
    "seaborn>=0.13",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["pruning_transformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
